name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: RSpec And Site Build
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler-cache: true
      - name: Run RSpec
        run: bundle exec rspec
      - name: Build Site
        run: bundle exec jekyll build --quiet
