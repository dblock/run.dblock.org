name: Publish Link Checker Report

on:
  workflow_run:
    workflows: [Check Links]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  publish:
    # Comments on pull requests, and keeps a broken links issue up to date on gh-pages.
    # Keep the version in sync with the Gemfile.
    uses: dblock/jekyll-ruby-link-checker/.github/workflows/publish-report.yml@v0.2.0
    with:
      issue: 'true'
