---
layout: default
title: PRs
comments: false
---
<h1>PRs</h1>
{% for pr_hash in site.data.prs %}
  {% assign key = pr_hash[0] %}
  {% assign pr = pr_hash[1] %}
  <article>
    <h2><a href='/{{ pr.file }}'>{{ key }}{% if key == 1 %} mile{% else %} miles{% endif %}</a>
      <span class="totals"><small>{{ pr.time_s }} @ {{ pr.pace_s }}</small></span>
    </h2>
  </article>
{% endfor %}
