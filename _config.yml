---
title: run.dblock.org | running blog
locale: en_US
url: https://run.dblock.org
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
plugins:
- jekyll-paginate
- jekyll-sitemap
- jekyll-redirect-from
- jekyll-md
- jekyll-ruby-link-checker
link_checker:
  cache:
    file: .cache/link-checker.json
    ttl: 30d
    # Sites behind bot protection are reported as unverified, and checked again weekly.
    blocked_ttl: 7d
    prune: true
  exclude:
    urls:
      # Share and edit links on every post, which need an account and answer 429 or a sign-in page.
      - '/\Ahttps:\/\/www\.facebook\.com\/sharer\//'
      - '/\Ahttps:\/\/twitter\.com\/intent\//'
      - '/\Ahttps:\/\/github\.com\/dblock\/run\.dblock\.org\/edit\//'
  user_agent: run.dblock.org Link Checker/1.0
  # Log every link as it is checked, so long runs in CI show progress.
  verbose: true
md:
  selector: "#markdown-content"
kramdown:
  input: GFM
owner:
  name: Daniel Doubrovkine
  avatar: blog.png
  bio: aka dB., NYC
  email: dblock@dblock.org
  website: https://code.dblock.org
  repository: run.dblock.org
  twitter: dblockdotorg
  facebook:
  google:
    plus:
    analytics: UA-4756101-5
    verify: o1dQjOsMqvIla4zMSdwhkmHSa-0mLMMi-v_ITY1BEhc
    ad-client:
    ad-slot:
  bing-verify:
  github: dblock
  stackoverflow:
  linkedin: dblock
  instagram: rundblockdotorg
  lastfm:
  tumblr:
  pinterest:
  foursquare:
  steam:
  dribbble:
  youtube:
  soundcloud:
  strava: dblockdotorg
  nyrr-results: 52863476
running_letters_idle_seconds: 30
paginate: 30
google_custom_search: c49b3b44d83b44c32
edit_url: https://github.com/dblock/run.dblock.org/edit/gh-pages/
exclude:
- Gemfile
- Gemfile.lock
- spec
- node_modules
- vendor
- README.md
- CRON.md
