<h2 class="section-heading">Read</h2>
{% for post in site.posts %}
  {% capture year %}{{post.date | date: "%Y"}}{% endcapture %}
  {% capture current_year %}{{'now' | date: "%Y"}}{% endcapture %}
  {% unless post.strava_id %}
    <article>
      <h3 class="item-heading"><a href="{{ post.url }}" title="{{ post.title }}">{{ post.title }}</a><span class='read'>READ</span></h3>
    </article>
  {% endunless %}
{% endfor %}
